<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — UOB IT PMO</title>

<!-- Inline favicon: stops the browser's automatic /favicon.ico request 404ing -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231565c0'/><text x='16' y='23' font-family='Segoe UI,Arial,sans-serif' font-size='16' font-weight='700' fill='white' text-anchor='middle'>P</text></svg>">

<style>
:root {
  --c-navy-900: #08213f;
  --c-navy-800: #0d2f57;
  --c-blue-600: #1565c0;
  --c-blue-500: #1e7ae0;
  --c-ink: #17202a;
  --c-ink-soft: #4a5866;
  --c-canvas: #f2f5f9;
  --c-surface: #ffffff;
  --c-line: #d8dee6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: var(--font);
  color: var(--c-ink);
  background: var(--c-canvas);
}

.panel {
  background: var(--c-surface);
  border: 1px solid var(--c-line);
  border-radius: 8px;
  box-shadow: 0 1px 3px rgba(8, 33, 63, .1);
  max-width: 520px;
  width: 100%;
  overflow: hidden;
}

.panel-header {
  background: linear-gradient(180deg, var(--c-navy-800), var(--c-navy-900));
  color: #fff;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.badge {
  display: grid;
  place-items: center;
  width: 38px; height: 38px;
  border-radius: 5px;
  background: var(--c-blue-600);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .5px;
}

.wordmark strong { font-size: 17px; letter-spacing: .3px; }
.wordmark span { display: block; font-size: 11.5px; color: #b9cbe2; }

.panel-body { padding: 24px; }

h1 { margin: 0 0 8px; font-size: 20px; }

p { margin: 0 0 16px; color: var(--c-ink-soft); line-height: 1.5; }

code {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  background: #eef1f5;
  border: 1px solid var(--c-line);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.btn {
  display: inline-block;
  background: var(--c-blue-600);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  border-radius: 5px;
  padding: 9px 18px;
}
.btn:hover { background: var(--c-blue-500); }

a:focus-visible, .btn:focus-visible {
  outline: 3px solid var(--c-blue-500);
  outline-offset: 2px;
}
</style>
</head>
<body>

<main class="panel">
  <div class="panel-header">
    <span class="badge" aria-hidden="true">PMO</span>
    <span class="wordmark">
      <strong>UOB IT PMO</strong>
      <span>Project Management Board — internal demo</span>
    </span>
  </div>

  <div class="panel-body">
    <h1>404 — page not found</h1>
    <p>
      There is nothing at <code id="path">this address</code>. This site is a single-page
      demo, so the board is the only page it serves.
    </p>
    <p><a class="btn" href="/uobclaudetraining/">Go to the board</a></p>
  </div>
</main>

<script>
// Show the path that was actually requested, escaped via textContent
document.getElementById("path").textContent = window.location.pathname;
</script>

</body>
</html>
